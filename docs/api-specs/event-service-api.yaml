openapi: 3.0.3
info:
  title: Eventify - Event Service API
  description: RESTful API for managing events and RSVPs in the Eventify platform
  version: 1.0.0
  contact:
    name: Eventify Team
servers:
  - url: http://localhost:3000/api
    description: Development server (via API Gateway)

paths:
  /events:
    get:
      summary: List all events
      description: Returns a paginated list of events. Supports filtering by category, date, and keyword search.
      tags: [Events]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer
    post:
      summary: Create a new event
      tags: [Events]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized
        '400':
          description: Validation error

  /events/{id}:
    get:
      summary: Get event by ID
      tags: [Events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
    put:
      summary: Update an event
      tags: [Events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '200':
          description: Event updated
        '403':
          description: Forbidden (not the creator)
        '404':
          description: Event not found
    delete:
      summary: Delete an event
      tags: [Events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Event deleted
        '403':
          description: Forbidden
        '404':
          description: Event not found

  /events/{id}/rsvp:
    post:
      summary: RSVP to an event
      tags: [RSVP]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: RSVP confirmed
        '400':
          description: Event is full or already RSVP'd
        '401':
          description: Unauthorized
        '404':
          description: Event not found
    delete:
      summary: Cancel RSVP
      tags: [RSVP]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: RSVP cancelled
        '404':
          description: RSVP not found

  /events/{id}/attendees:
    get:
      summary: List event attendees
      tags: [RSVP]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of attendees
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendees:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attendee'
                  count:
                    type: integer

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Event:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        location:
          type: string
        category:
          type: string
        max_capacity:
          type: integer
        current_attendees:
          type: integer
        creator_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventCreate:
      type: object
      required:
        - title
        - date
        - location
        - max_capacity
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        date:
          type: string
          format: date-time
        location:
          type: string
        category:
          type: string
          enum: [conference, workshop, social, sports, music, other]
        max_capacity:
          type: integer
          minimum: 1

    Attendee:
      type: object
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
        rsvp_date:
          type: string
          format: date-time
