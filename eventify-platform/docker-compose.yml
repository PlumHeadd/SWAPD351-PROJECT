services:
  # --- API Gateway ---
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - USER_SERVICE_URL=http://user-service:3001
      - EVENT_SERVICE_URL=http://event-service:5001
      - CHAT_SERVICE_URL=http://chat-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5002
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=eventify_jwt_secret_key_2026
    depends_on:
      - redis
      - user-service
      - event-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - eventify-net

  # --- User Service (Node.js) ---
  user-service:
    build: ./services/user-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://eventify:eventify123@postgres:5432/eventify_users
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=eventify_jwt_secret_key_2026
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-placeholder}
      - GOOGLE_CALLBACK_URL=http://localhost:3000/api/auth/google/callback
    depends_on:
      - postgres
      - redis
    networks:
      - eventify-net

  # --- Event Service (Python/Flask) ---
  event-service:
    build: ./services/event-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/eventify_events
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=eventify_jwt_secret_key_2026
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    volumes:
      # Allow pytest via docker exec (paths align with tests/unit -> ../../services/...)
      - ./tests:/tests:ro
      - ./services:/services:ro
    networks:
      - eventify-net

  # --- Chat Service (Node.js/Socket.io) ---
  chat-service:
    build: ./services/chat-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/eventify_chat
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=eventify_jwt_secret_key_2026
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - eventify-net

  # --- Mailhog (Local email catcher — inbox at http://localhost:8025) ---
  mailhog:
    image: mailhog/mailhog:latest
    container_name: eventify-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web inbox UI
    networks:
      - eventify-net
    restart: unless-stopped

  # --- Notification Service (Python/Flask) ---
  notification-service:
    build: ./services/notification-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - USER_SERVICE_URL=http://user-service:3001
      # Reads from .env in this folder — update SMTP_PASS there
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_USER:-noreply@eventify.local}
    depends_on:
      - rabbitmq
      - redis
      - user-service
      - mailhog
    volumes:
      - ./tests:/tests:ro
      - ./services:/services:ro
    networks:
      - eventify-net

  # --- Frontend (React) ---
  frontend:
    build: ./frontend
    ports:
      - "3080:80"
    depends_on:
      - api-gateway
    networks:
      - eventify-net

  # ============ INFRASTRUCTURE ============

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=eventify
      - POSTGRES_PASSWORD=eventify123
      - POSTGRES_DB=eventify_users
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/user-service/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventify -d eventify_users"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eventify-net

  # --- MongoDB ---
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventify-net

  # --- Redis ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - eventify-net

  # --- RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - eventify-net

  # --- Fluent Bit (Log collector → OpenSearch) ---
  fluent-bit:
    image: fluent/fluent-bit:3.0
    volumes:
      - ./monitoring/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./monitoring/fluent-bit-parsers.conf:/fluent-bit/etc/parsers_custom.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - opensearch
    networks:
      - eventify-net
    restart: unless-stopped

  # --- OpenSearch (Logging) ---
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - eventify-net

  # --- OpenSearch Dashboards ---
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    depends_on:
      - opensearch
    networks:
      - eventify-net

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
    ports:
      - "9090:9090"
    networks:
      - eventify-net

  # --- Grafana ---
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/eventify-dashboard.json:/etc/grafana/provisioning/dashboards/eventify-dashboard.json
    depends_on:
      - prometheus
    networks:
      - eventify-net

  # --- Node Exporter (Host Metrics) ---
  node-exporter:
    image: prom/node-exporter:latest
    container_name: eventify-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    ports:
      - "9100:9100"
    networks:
      - eventify-net
    restart: unless-stopped

  # --- cAdvisor (Container Metrics) ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: eventify-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - eventify-net
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  opensearch_data:
  grafana_data:

networks:
  eventify-net:
    driver: bridge
