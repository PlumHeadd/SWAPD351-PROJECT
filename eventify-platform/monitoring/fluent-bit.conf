[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     warn
    Parsers_File  parsers_custom.conf

# Collect all Docker container logs
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /var/log/flb_docker.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# Enrich with Docker metadata (container name, image, labels)
[FILTER]
    Name         docker_metadata
    Match        docker.*
    Unescape_Log On

# Add a timestamp field for OpenSearch
[FILTER]
    Name    modify
    Match   docker.*
    Add     source eventify-platform

# Ship to OpenSearch
[OUTPUT]
    Name            opensearch
    Match           docker.*
    Host            opensearch
    Port            9200
    Index           eventify-logs
    Type            _doc
    Suppress_Type_Name On
    tls             Off
    tls.verify      Off
    Logstash_Format On
    Logstash_Prefix eventify-logs
    Include_Tag_Key On
    Tag_Key         tag
    Retry_Limit     3
