# Prometheus Alert Rules for Eventify Platform
# To be loaded by Prometheus or Grafana

groups:
  - name: eventify_critical_alerts
    interval: 30s
    rules:
      # Service Health Alerts
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute. Immediate action required."
          runbook_url: "https://docs.eventify.com/runbooks/service-down"

      - alert: HighErrorRate
        expr: (sum(rate(http_requests_total{status=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job)) > 0.05
        for: 5m
        labels:
          severity: critical
          category: reliability
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} has error rate above 5% for the last 5 minutes (current: {{ $value | humanizePercentage }})."
          runbook_url: "https://docs.eventify.com/runbooks/high-error-rate"

      - alert: DatabaseConnectionPoolExhausted
        expr: db_connections_active >= db_connections_max
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Database connection pool exhausted on {{ $labels.job }}"
          description: "{{ $labels.job }} has exhausted its database connection pool. New requests will fail."
          runbook_url: "https://docs.eventify.com/runbooks/db-pool-exhausted"

      - alert: DiskSpaceCritical
        expr: ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) < 10
        for: 5m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Disk space critically low"
          description: "Root filesystem has less than 10% space available (current: {{ $value | humanizePercentage }})."
          runbook_url: "https://docs.eventify.com/runbooks/disk-space-critical"

  - name: eventify_warning_alerts
    interval: 1m
    rules:
      # Performance Alerts
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[10m])) by (le, job)) > 1
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High latency on {{ $labels.job }}"
          description: "{{ $labels.job }} has p95 latency above 1 second for the last 10 minutes (current: {{ $value }}s)."
          runbook_url: "https://docs.eventify.com/runbooks/high-latency"

      - alert: CacheMissRateHigh
        expr: (sum(rate(cache_misses_total[15m])) by (job) / (sum(rate(cache_hits_total[15m])) by (job) + sum(rate(cache_misses_total[15m])) by (job))) > 0.5
        for: 15m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Cache miss rate high on {{ $labels.job }}"
          description: "{{ $labels.job }} cache miss rate is above 50% (current: {{ $value | humanizePercentage }})."
          runbook_url: "https://docs.eventify.com/runbooks/cache-miss-rate-high"

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 1
        for: 5m
        labels:
          severity: warning
          category: resilience
        annotations:
          summary: "Circuit breaker open on {{ $labels.job }}"
          description: "{{ $labels.job }} has circuit breaker in open state for 5 minutes. Requests are failing."
          runbook_url: "https://docs.eventify.com/runbooks/circuit-breaker-open"

      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_queue_messages > 1000
        for: 10m
        labels:
          severity: warning
          category: message_queue
        annotations:
          summary: "RabbitMQ queue backlog"
          description: "RabbitMQ queue {{ $labels.queue }} has more than 1000 messages (current: {{ $value }})."
          runbook_url: "https://docs.eventify.com/runbooks/queue-backlog"

      - alert: HighMemoryUsage
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) < 20
        for: 10m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High memory usage"
          description: "Available memory is below 20% (current: {{ $value | humanizePercentage }})."
          runbook_url: "https://docs.eventify.com/runbooks/high-memory-usage"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for 10 minutes (current: {{ $value }}%)."
          runbook_url: "https://docs.eventify.com/runbooks/high-cpu-usage"

      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes * 100) > 90
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Container {{ $labels.name }} high memory usage"
          description: "Container {{ $labels.name }} is using more than 90% of its memory limit (current: {{ $value }}%)."
          runbook_url: "https://docs.eventify.com/runbooks/container-high-memory"

  - name: eventify_business_alerts
    interval: 5m
    rules:
      - alert: EventCreationRateDrop
        expr: rate(events_created_total[1h]) < 0.1
        for: 1h
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Event creation rate dropped significantly"
          description: "Event creation rate is unusually low (less than 0.1/sec for 1 hour)."
          runbook_url: "https://docs.eventify.com/runbooks/event-creation-drop"

      - alert: NoRSVPsInLast Hour
        expr: rate(rsvps_created_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
          category: business
        annotations:
          summary: "No RSVPs in the last hour"
          description: "No RSVPs have been created in the last hour. This may indicate a problem."
          runbook_url: "https://docs.eventify.com/runbooks/no-rsvps"

  - name: eventify_info_alerts
    interval: 5m
    rules:
      - alert: ServiceRestarted
        expr: changes(process_start_time_seconds[5m]) > 0
        labels:
          severity: info
          category: operations
        annotations:
          summary: "Service {{ $labels.job }} restarted"
          description: "{{ $labels.job }} has restarted in the last 5 minutes."

      - alert: DiskSpaceWarning
        expr: ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) < 20
        for: 10m
        labels:
          severity: info
          category: infrastructure
        annotations:
          summary: "Disk space low (warning)"
          description: "Root filesystem has less than 20% space available (current: {{ $value | humanizePercentage }})."

